# HEMS Observability and Learning Package
#
# Observation-only package. It does not call any Tesla, SolarEdge, BYD, Amber,
# inverter, battery, charger, switch, select, number or button control service.
# It records one end-of-day snapshot, calculates learning indicators and sends
# one generic Home Assistant persistent notification. Replace that final action
# with your own mobile notification service if desired.

input_boolean:
  hems_daily_summary_notifications_enabled:
    name: HEMS Daily Summary Notifications Enabled
    icon: mdi:message-badge-outline
    initial: true

input_datetime:
  hems_observability_tracking_start:
    name: HEMS Observability Tracking Start
    icon: mdi:calendar-start
    has_date: true
    has_time: true
    initial: "2026-07-30 00:00:00"

  hems_daily_summary_time:
    name: HEMS Daily Summary Time
    icon: mdi:clock-check-outline
    has_date: false
    has_time: true
    initial: "19:30:00"

  hems_last_daily_summary:
    name: HEMS Last Daily Summary
    icon: mdi:calendar-check-outline
    has_date: true
    has_time: true

input_number:
  hems_last_solar_actual:
    name: HEMS Last Solar Actual
    icon: mdi:solar-power
    min: 0
    max: 200
    step: 0.01
    unit_of_measurement: kWh
    mode: box

  hems_last_solar_forecast_central:
    name: HEMS Last Solar Forecast Central
    icon: mdi:weather-sunny-alert
    min: 0
    max: 200
    step: 0.01
    unit_of_measurement: kWh
    mode: box

  hems_last_solar_forecast_conservative:
    name: HEMS Last Solar Forecast Conservative
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 200
    step: 0.01
    unit_of_measurement: kWh
    mode: box

  hems_last_solar_forecast_error_kwh:
    name: HEMS Last Solar Forecast Error
    icon: mdi:chart-bell-curve-cumulative
    min: -200
    max: 200
    step: 0.01
    unit_of_measurement: kWh
    mode: box
    initial: 0

  hems_last_solar_forecast_ratio:
    name: HEMS Last Solar Forecast Actual Ratio
    icon: mdi:chart-timeline-variant-shimmer
    min: 0
    max: 3
    step: 0.001
    mode: box
    initial: 1

  hems_overnight_reserve_safety_margin:
    name: HEMS Overnight Reserve Safety Margin
    icon: mdi:shield-plus-outline
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: kWh
    mode: box
    initial: 2

  hems_powerwall_usable_capacity:
    name: HEMS Powerwall Usable Capacity
    icon: mdi:battery-high
    min: 1
    max: 30
    step: 0.1
    unit_of_measurement: kWh
    mode: box
    initial: 13.5

input_text:
  hems_last_daily_summary_status:
    name: HEMS Last Daily Summary Status
    icon: mdi:text-box-check-outline
    max: 255
    initial: NOT_YET_RECORDED

template:
  - sensor:
      - name: HEMS Observability Tracking Days
        unique_id: hems_observability_tracking_days_v1
        icon: mdi:calendar-range
        unit_of_measurement: d
        state_class: measurement
        state: >-
          {% set start = states('input_datetime.hems_observability_tracking_start') %}
          {% set start_ts = as_timestamp(start, none) %}
          {% if start_ts is none %}
            0
          {% else %}
            {{ [((as_timestamp(now()) - start_ts) / 86400), 0] | max | round(1) }}
          {% endif %}

      - name: HEMS Last Solar Forecast Error Percent
        unique_id: hems_last_solar_forecast_error_percent_v1
        icon: mdi:percent-outline
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ states('input_text.hems_last_daily_summary_status') != 'NOT_YET_RECORDED'
             and states('input_number.hems_last_solar_forecast_central') | float(0) > 0.1 }}
        state: >-
          {% set forecast = states('input_number.hems_last_solar_forecast_central') | float(0) %}
          {% set error = states('input_number.hems_last_solar_forecast_error_kwh') | float(0) %}
          {% if forecast > 0.1 %}
            {{ ((error / forecast) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: HEMS Last Solar Forecast Accuracy
        unique_id: hems_last_solar_forecast_accuracy_v1
        icon: mdi:target-variant
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ states('input_text.hems_last_daily_summary_status') != 'NOT_YET_RECORDED'
             and is_number(states('sensor.hems_last_solar_forecast_error_percent')) }}
        state: >-
          {% set error = states('sensor.hems_last_solar_forecast_error_percent') | float(0) | abs %}
          {{ [[100 - error, 0] | max, 100] | min | round(1) }}

      - name: HEMS Suggested Solar Forecast Multiplier
        unique_id: hems_suggested_solar_forecast_multiplier_v1
        icon: mdi:tune-variant
        state_class: measurement
        state: >-
          {% if states('input_text.hems_last_daily_summary_status') == 'NOT_YET_RECORDED' %}
            {% set raw = 1 %}
          {% else %}
            {% set ratio_30 = states('sensor.hems_solar_forecast_ratio_30_day') %}
            {% set ratio_7 = states('sensor.hems_solar_forecast_ratio_7_day') %}
            {% set latest = states('input_number.hems_last_solar_forecast_ratio') | float(1) %}
            {% if is_number(ratio_30) %}
              {% set raw = ratio_30 | float %}
            {% elif is_number(ratio_7) %}
              {% set raw = ratio_7 | float %}
            {% else %}
              {% set raw = latest %}
            {% endif %}
          {% endif %}
          {{ [[raw, 0.4] | max, 1.25] | min | round(3) }}
        attributes:
          meaning: >-
            Multiply the central Solcast forecast by this value for an observed
            historical correction. This sensor is advisory only.
          seven_day_ratio: "{{ states('sensor.hems_solar_forecast_ratio_7_day') }}"
          thirty_day_ratio: "{{ states('sensor.hems_solar_forecast_ratio_30_day') }}"

      - name: HEMS Valid Solar Forecast Ratio
        unique_id: hems_valid_solar_forecast_ratio_v1
        icon: mdi:chart-line
        state_class: measurement
        availability: >-
          {{ states('input_text.hems_last_daily_summary_status') != 'NOT_YET_RECORDED'
             and states('input_number.hems_last_solar_forecast_central') | float(0) > 0.1 }}
        state: >-
          {{ states('input_number.hems_last_solar_forecast_ratio') | float(1) | round(3) }}

      - name: HEMS Adaptive Overnight Powerwall Recommendation
        unique_id: hems_adaptive_overnight_powerwall_recommendation_v1
        icon: mdi:battery-clock-outline
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set avg_30 = states('sensor.hems_overnight_usage_30_day') %}
          {% set avg_7 = states('sensor.hems_overnight_usage_7_day') %}
          {% set existing = states('input_number.hems_overnight_usage_average') %}
          {% set safety = states('input_number.hems_overnight_reserve_safety_margin') | float(2) %}
          {% set capacity = states('input_number.hems_powerwall_usable_capacity') | float(13.5) %}
          {% set minimum = states('input_number.minimum_power_reserve') | float(20) %}
          {% if is_number(avg_30) %}
            {% set overnight = avg_30 | float %}
          {% elif is_number(avg_7) %}
            {% set overnight = avg_7 | float %}
          {% elif is_number(existing) %}
            {% set overnight = existing | float %}
          {% else %}
            {% set overnight = 0 %}
          {% endif %}
          {% set raw = ((overnight + safety) / capacity * 100) if capacity > 0 else minimum %}
          {% set rounded = ((raw / 5) | round(0, 'ceil') * 5) %}
          {{ [[rounded, minimum] | max, 100] | min | round(0) }}
        attributes:
          advisory_only: true
          overnight_7_day_kwh: "{{ states('sensor.hems_overnight_usage_7_day') }}"
          overnight_30_day_kwh: "{{ states('sensor.hems_overnight_usage_30_day') }}"
          lifetime_sample_average_kwh: "{{ states('input_number.hems_overnight_usage_average') }}"
          safety_margin_kwh: "{{ states('input_number.hems_overnight_reserve_safety_margin') }}"

      - name: HEMS Critical Data Quality
        unique_id: hems_critical_data_quality_v1
        icon: mdi:database-check-outline
        state: >-
          {% set entities = [
            'sensor.hems_effective_powerwall',
            'sensor.hems_effective_ev_soc',
            'sensor.hems_effective_import_price',
            'sensor.hems_effective_feed_in_price',
            'sensor.hems_effective_grid_power',
            'sensor.hems_effective_battery_power',
            'sensor.hems_effective_solar_power',
            'sensor.hems_expected_powerwall_mode',
            'sensor.hems_solar_export_limit',
            'sensor.ev_charging_availability'
          ] %}
          {% set ns = namespace(bad=[]) %}
          {% for entity in entities %}
            {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.bad = ns.bad + [entity] %}
            {% endif %}
          {% endfor %}
          {% if ns.bad | count == 0 %}HEALTHY
          {% elif ns.bad | count <= 2 %}ATTENTION
          {% else %}CRITICAL
          {% endif %}
        attributes:
          unavailable_count: >-
            {% set entities = [
              'sensor.hems_effective_powerwall',
              'sensor.hems_effective_ev_soc',
              'sensor.hems_effective_import_price',
              'sensor.hems_effective_feed_in_price',
              'sensor.hems_effective_grid_power',
              'sensor.hems_effective_battery_power',
              'sensor.hems_effective_solar_power',
              'sensor.hems_expected_powerwall_mode',
              'sensor.hems_solar_export_limit',
              'sensor.ev_charging_availability'
            ] %}
            {% set ns = namespace(count=0) %}
            {% for entity in entities %}
              {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}
          unavailable_entities: >-
            {% set entities = [
              'sensor.hems_effective_powerwall',
              'sensor.hems_effective_ev_soc',
              'sensor.hems_effective_import_price',
              'sensor.hems_effective_feed_in_price',
              'sensor.hems_effective_grid_power',
              'sensor.hems_effective_battery_power',
              'sensor.hems_effective_solar_power',
              'sensor.hems_expected_powerwall_mode',
              'sensor.hems_solar_export_limit',
              'sensor.ev_charging_availability'
            ] %}
            {% set ns = namespace(bad=[]) %}
            {% for entity in entities %}
              {% if states(entity) in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.bad = ns.bad + [entity] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad | join(', ') if ns.bad | count > 0 else 'none' }}
          quality_score: >-
            {% set entities = [
              'sensor.hems_effective_powerwall',
              'sensor.hems_effective_ev_soc',
              'sensor.hems_effective_import_price',
              'sensor.hems_effective_feed_in_price',
              'sensor.hems_effective_grid_power',
              'sensor.hems_effective_battery_power',
              'sensor.hems_effective_solar_power',
              'sensor.hems_expected_powerwall_mode',
              'sensor.hems_solar_export_limit',
              'sensor.ev_charging_availability'
            ] %}
            {% set ns = namespace(good=0) %}
            {% for entity in entities %}
              {% if states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.good = ns.good + 1 %}
              {% endif %}
            {% endfor %}
            {{ (ns.good / (entities | count) * 100) | round(0) }}

      - name: HEMS Worker Enablement
        unique_id: hems_worker_enablement_v1
        icon: mdi:robot-industrial-outline
        state: >-
          {% set workers = [
            'automation.hems_brain_scheduler',
            'automation.hems_powerwall_worker',
            'automation.hems_ev_worker',
            'automation.hems_solar_worker',
            'automation.hems_financial_worker',
            'automation.hems_native_excess_supervisor'
          ] %}
          {% set ns = namespace(disabled=[]) %}
          {% for worker in workers %}
            {% if not is_state(worker, 'on') %}
              {% set ns.disabled = ns.disabled + [worker] %}
            {% endif %}
          {% endfor %}
          {{ 'ALL_ENABLED' if ns.disabled | count == 0 else 'ATTENTION' }}
        attributes:
          disabled_workers: >-
            {% set workers = [
              'automation.hems_brain_scheduler',
              'automation.hems_powerwall_worker',
              'automation.hems_ev_worker',
              'automation.hems_solar_worker',
              'automation.hems_financial_worker',
              'automation.hems_native_excess_supervisor'
            ] %}
            {% set ns = namespace(disabled=[]) %}
            {% for worker in workers %}
              {% if not is_state(worker, 'on') %}
                {% set ns.disabled = ns.disabled + [worker] %}
              {% endif %}
            {% endfor %}
            {{ ns.disabled | join(', ') if ns.disabled | count > 0 else 'none' }}
          brain: "{{ states('automation.hems_brain_scheduler') }}"
          powerwall: "{{ states('automation.hems_powerwall_worker') }}"
          ev: "{{ states('automation.hems_ev_worker') }}"
          solar: "{{ states('automation.hems_solar_worker') }}"
          financial: "{{ states('automation.hems_financial_worker') }}"
          native_excess: "{{ states('automation.hems_native_excess_supervisor') }}"

      - name: HEMS Reliability Summary
        unique_id: hems_reliability_summary_v1
        icon: mdi:shield-home-outline
        state: >-
          {% set data = states('sensor.hems_critical_data_quality') %}
          {% set workers = states('sensor.hems_worker_enablement') %}
          {% set ev_guard = states('sensor.hems_ev_worker_command_guard') %}
          {% set pw_guard = states('sensor.energy_brain_guardian') | upper %}
          {% set solar_guard = states('sensor.hems_solar_guardian') | upper %}
          {% if data == 'CRITICAL' or ev_guard == 'FAULT_LOCKOUT' %}
            CRITICAL
          {% elif data != 'HEALTHY'
                or workers != 'ALL_ENABLED'
                or 'MISMATCH' in pw_guard
                or 'FAULT' in pw_guard
                or 'MISMATCH' in solar_guard
                or 'FAULT' in solar_guard %}
            ATTENTION
          {% else %}
            HEALTHY
          {% endif %}
        attributes:
          data_quality: "{{ states('sensor.hems_critical_data_quality') }}"
          data_quality_score: "{{ state_attr('sensor.hems_critical_data_quality', 'quality_score') }}"
          worker_enablement: "{{ states('sensor.hems_worker_enablement') }}"
          powerwall_guardian: "{{ states('sensor.energy_brain_guardian') }}"
          ev_guardian: "{{ states('sensor.hems_ev_guardian') }}"
          solar_guardian: "{{ states('sensor.hems_solar_guardian') }}"
          ev_command_guard: "{{ states('sensor.hems_ev_worker_command_guard') }}"
          ev_powerwall_interlock: "{{ states('sensor.hems_ev_powerwall_interlock_status') }}"
          native_excess_supervisor: "{{ states('sensor.hems_native_excess_supervisor') }}"
          charging_deadline: "{{ states('sensor.hems_charging_deadline_feasibility') }}"

      - name: HEMS Savings Confidence
        unique_id: hems_savings_confidence_v1
        icon: mdi:chart-timeline-variant
        state: >-
          {% set days = states('sensor.hems_observability_tracking_days') | float(0) %}
          {% if days < 7 %}INITIAL
          {% elif days < 30 %}EARLY
          {% elif days < 90 %}DEVELOPING
          {% elif days < 180 %}SEASONAL_PARTIAL
          {% else %}MATURE
          {% endif %}
        attributes:
          tracked_days: "{{ states('sensor.hems_observability_tracking_days') }}"
          selected_period: "{{ states('input_select.hems_savings_timescale') }}"
          solar_average_aud_per_kwh: "{{ states('sensor.hems_solar_average_savings_selected_period') }}"
          powerwall_average_aud_per_kwh: "{{ states('sensor.hems_powerwall_average_savings_selected_period') }}"
          guidance: >-
            Initial and early averages can move sharply. Use the 90-day and
            longer results for seasonal planning.

sensor:
  - platform: statistics
    name: HEMS Solar Forecast Ratio 7 Day
    unique_id: hems_solar_forecast_ratio_7_day_v1
    entity_id: sensor.hems_valid_solar_forecast_ratio
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 20
    precision: 3
    keep_last_sample: true

  - platform: statistics
    name: HEMS Solar Forecast Ratio 30 Day
    unique_id: hems_solar_forecast_ratio_30_day_v1
    entity_id: sensor.hems_valid_solar_forecast_ratio
    state_characteristic: mean
    max_age:
      days: 30
    sampling_size: 60
    precision: 3
    keep_last_sample: true

  - platform: statistics
    name: HEMS Overnight Usage 7 Day
    unique_id: hems_overnight_usage_7_day_v1
    entity_id: input_number.hems_overnight_usage
    state_characteristic: mean
    max_age:
      days: 7
    sampling_size: 20
    precision: 2
    keep_last_sample: true

  - platform: statistics
    name: HEMS Overnight Usage 30 Day
    unique_id: hems_overnight_usage_30_day_v1
    entity_id: input_number.hems_overnight_usage
    state_characteristic: mean
    max_age:
      days: 30
    sampling_size: 60
    precision: 2
    keep_last_sample: true

automation:
  - id: hems_daily_performance_summary_20260802
    alias: HEMS - Daily Performance Summary
    description: >-
      Observation-only daily snapshot and one generic Home Assistant summary.
      Records forecast accuracy and never sends a hardware control command.
    mode: single
    trigger:
      - platform: time
        at: input_datetime.hems_daily_summary_time
    variables:
      forecast_date: "{{ states('input_text.hems_solar_morning_forecast_date') }}"
      forecast_valid: >-
        {{ forecast_date == now().strftime('%Y-%m-%d')
           and is_number(states('input_number.hems_solar_morning_forecast_central'))
           and states('input_number.hems_solar_morning_forecast_central') | float(0) > 0.1 }}
      central_forecast: >-
        {{ states('input_number.hems_solar_morning_forecast_central') | float(0) }}
      conservative_forecast: >-
        {{ states('input_number.hems_solar_morning_forecast_conservative') | float(0) }}
      actual_solar: >-
        {{ states('sensor.house_solaredge_se8250h_inverter_solar_actual_today') | float(0) }}
      forecast_error: >-
        {{ (actual_solar | float(0) - central_forecast | float(0)) | round(2) }}
      forecast_ratio: >-
        {% if forecast_valid and central_forecast | float(0) > 0.1 %}
          {{ [[actual_solar | float(0) / central_forecast | float(0), 0] | max, 3] | min | round(3) }}
        {% else %}
          1
        {% endif %}
      powerwall_soc: "{{ states('sensor.hems_effective_powerwall') | float(0) }}"
      powerwall_target: "{{ states('input_number.powerwall_target') | float(80) }}"
      powerwall_required: "{{ states('sensor.powerwall_energy_required') | float(0) }}"
      ev_soc: "{{ states('sensor.hems_effective_ev_soc') | float(0) }}"
      ev_target: "{{ states('sensor.hems_ev_target_today') | float(80) }}"
      ev_availability: "{{ states('sensor.ev_charging_availability') }}"
      ev_active_today: >-
        {{ ev_availability in ['READY', 'CHARGING']
           or is_state('input_boolean.ev_expected_back_today', 'on') }}
      summary_status: >-
        {% set ns = namespace(items=[]) %}
        {% if powerwall_soc | float(0) + 0.5 < powerwall_target | float(80) %}
          {% set ns.items = ns.items + ['POWERWALL_SHORTFALL'] %}
        {% endif %}
        {% if ev_active_today and ev_soc | float(0) + 0.5 < ev_target | float(80) %}
          {% set ns.items = ns.items + ['EV_SHORTFALL'] %}
        {% endif %}
        {% if states('sensor.hems_reliability_summary') != 'HEALTHY' %}
          {% set ns.items = ns.items + ['SYSTEM_ATTENTION'] %}
        {% endif %}
        {{ ns.items | join('_AND_') if ns.items | count > 0 else 'TARGETS_MET' }}
    action:
      - choose:
          - conditions: "{{ forecast_valid }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.hems_last_solar_actual
                data:
                  value: "{{ actual_solar | float(0) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.hems_last_solar_forecast_central
                data:
                  value: "{{ central_forecast | float(0) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.hems_last_solar_forecast_conservative
                data:
                  value: "{{ conservative_forecast | float(0) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.hems_last_solar_forecast_error_kwh
                data:
                  value: "{{ forecast_error | float(0) | round(2) }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.hems_last_solar_forecast_ratio
                data:
                  value: "{{ forecast_ratio | float(1) | round(3) }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.hems_last_daily_summary_status
        data:
          value: "{{ summary_status }}"

      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hems_last_daily_summary
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - condition: state
        entity_id: input_boolean.hems_daily_summary_notifications_enabled
        state: "on"

      - service: persistent_notification.create
        data:
          title: HEMS daily performance summary
          notification_id: hems_daily_performance_summary
          message: >-
            Result: {{ summary_status }}.
            Solar produced {{ actual_solar | float(0) | round(1) }} kWh.
            {% if forecast_valid %}
            Morning forecast {{ central_forecast | float(0) | round(1) }} kWh;
            error {{ forecast_error | float(0) | round(1) }} kWh
            ({{ ((forecast_error | float(0) / central_forecast | float(1)) * 100) | round(0) }}%).
            {% else %}
            No valid morning forecast snapshot was available.
            {% endif %}
            Powerwall {{ powerwall_soc | round(0) }}% against
            {{ powerwall_target | round(0) }}% target
            ({{ powerwall_required | round(1) }} kWh remaining).
            EV {{ ev_soc | round(0) }}% against {{ ev_target | round(0) }}% target;
            availability {{ ev_availability }}{% if not ev_active_today %}, excluded from the remaining plan{% endif %}.
            Grid imported {{ states('sensor.house_home_energy_gateway_teslemetry_grid_imported_today') | float(0) | round(1) }} kWh
            and exported {{ states('sensor.house_home_energy_gateway_teslemetry_grid_exported_today') | float(0) | round(1) }} kWh.
            Savings: Solar ${{ states('sensor.hems_solar_savings_today') | float(0) | round(2) }},
            Powerwall ${{ states('sensor.hems_powerwall_savings_today') | float(0) | round(2) }}.
            Reliability {{ states('sensor.hems_reliability_summary') }};
            data quality {{ state_attr('sensor.hems_critical_data_quality', 'quality_score') }}%.
