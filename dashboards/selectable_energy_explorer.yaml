# HEMS Selectable Energy Explorer
#
# Full dashboard YAML. Create a separate dashboard and paste this entire file
# into its Raw configuration editor. The commissioning dashboard is unchanged.
#
# Requirements:
# - ApexCharts Card (already installed in this Home Assistant instance)
# - repairs/HEMS_Energy_Attribution_Package_2026-07-30.yaml installed first
#
# The source-to-destination splits are estimated from simultaneous AC power
# measurements. They are not utility-grade metering. Lifetime means since the
# attribution package was installed; Home Assistant did not record these exact
# routes before that date.

title: HEMS Energy Explorer

views:
  - title: Energy Explorer
    path: energy-explorer
    icon: mdi:chart-donut-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Energy Explorer
            icon: mdi:chart-donut-variant
            heading_style: title

          - type: entities
            grid_options:
              columns: full
            title: Choose Energy View
            show_header_toggle: false
            entities:
              - entity: input_select.hems_energy_source_view
                name: Energy source
              - entity: input_select.hems_energy_timescale
                name: Timescale
              - entity: sensor.hems_energy_attribution_match
                name: Live attribution match

          - type: markdown
            grid_options:
              columns: full
            content: |-
              **How to read this:** choose **Solar**, **Grid**, or **Powerwall**, then choose the period. The legend shows total energy for each destination. Powerwall has separate **Used By** and **Charged From** charts.

              *Detailed lifetime attribution starts when the new counters are installed. Short sensor-timing mismatches are excluded rather than assigned to an invented route.*

          - type: conditional
            grid_options:
              columns: full
            conditions:
              - entity: input_select.hems_energy_source_view
                state: Solar
              - entity: input_select.hems_energy_timescale
                state: Today
            card:
              type: custom:apexcharts-card
              update_interval: 5min
              graph_span: 24h
              span:
                start: day
              header:
                show: true
                title: Solar Energy — Used By — Today
                show_states: false
              stacked: true
              apex_config:
                chart:
                  height: 340px
                  toolbar:
                    show: false
                plotOptions:
                  bar:
                    columnWidth: 68%
                legend:
                  show: true
                  position: bottom
                  formatter: |
                    EVAL:function(seriesName, opts) {
                      const raw = opts.w.globals.series[opts.seriesIndex] || [];
                      const total = Array.isArray(raw)
                        ? raw.reduce((sum, value) => sum + (Number(value) || 0), 0)
                        : (Number(raw) || 0);
                      return seriesName + " · " + total.toFixed(1) + " kWh";
                    }
                yaxis:
                  min: 0
                  labels:
                    formatter: |
                      EVAL:function(value) {
                        return Number(value).toFixed(1) + " kWh";
                      }
                tooltip:
                  y:
                    formatter: |
                      EVAL:function(value) {
                        return Number(value).toFixed(2) + " kWh";
                      }
              series:
                - entity: sensor.hems_solar_to_home_energy
                  name: Home
                  color: "#5c6bc0"
                  type: column
                  float_precision: 3
                  statistics:
                    type: change
                    period: hour
                    align: start
                - entity: sensor.hems_solar_to_ev_energy
                  name: BYD Atto 3
                  color: "#42a5f5"
                  type: column
                  float_precision: 3
                  statistics:
                    type: change
                    period: hour
                    align: start
                - entity: sensor.hems_solar_to_powerwall_energy
                  name: Powerwall
                  color: "#66bb6a"
                  type: column
                  float_precision: 3
                  statistics:
                    type: change
                    period: hour
                    align: start
                - entity: sensor.hems_solar_to_grid_energy
                  name: Grid export
                  color: "#ef5350"
                  type: column
                  float_precision: 3
                  statistics:
                    type: change
                    period: hour
                    align: start

          - type: conditional
            grid_options:
              columns: full
            conditions:
              - entity: input_select.hems_energy_source_view
                state: Solar
              - entity: input_select.hems_energy_timescale
                state: This Week
