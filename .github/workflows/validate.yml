name: Validate Home Assistant YAML

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Parse YAML and compile Jinja
        shell: bash
        run: |
          mapfile -t files < <(
            find automations templates packages dashboards examples -type f \
              \( -name '*.yaml' -o -name '*.yml' -o -name '*.jinja' \) -print
          )
          python tools/validate_ha_yaml.py "${files[@]}"
