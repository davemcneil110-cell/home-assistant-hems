alias: HEMS - EV Charge Commitment Reset
description: >-
  Resets temporary EV planning helpers when their purpose has finished. EV
  Recovery Approved clears when the EV reaches its active target or the daily
  charging target time passes. EV Expected Back Today clears once the expected
  return is fulfilled. The daily reset clears both helpers and Long Drive
  Today. This automation only updates HEMS planning helpers and never controls
  hardware. A quiet reconciliation check also removes stale restored states
  after a Home Assistant restart.
triggers:
  - trigger: template
    value_template: >-
      {% set soc = states('sensor.hems_effective_ev_soc') %}
      {% set target = states('sensor.hems_ev_target_today') %}
      {{
        is_state('input_boolean.hems_ev_recovery_approved', 'on')
        and is_number(soc)
        and is_number(target)
        and (soc | float) >= (target | float)
      }}
    for: "00:01:00"
    id: target_met
  - trigger: time
    at: input_datetime.hems_charging_target_time
    id: target_time_reached
  - trigger: template
    value_template: >-
      {{
        is_state('input_boolean.ev_expected_back_today', 'on')
        and states('sensor.ev_charging_availability') in ['READY', 'CHARGING']
      }}
    for: "00:01:00"
    id: expected_return_fulfilled
  - trigger: time
    at: "00:05:00"
    id: daily_reset
  - trigger: time_pattern
    minutes: "/5"
    id: reconcile
conditions: []
actions:
  - variables:
      recovery_should_clear: >-
        {% set soc = states('sensor.hems_effective_ev_soc') %}
        {% set target = states('sensor.hems_ev_target_today') %}
        {% set configured = states('input_datetime.hems_charging_target_time') %}
        {% set target_time = configured
            if configured not in ['unknown', 'unavailable', 'none', '']
            else '14:30:00' %}
        {{
          is_state('input_boolean.hems_ev_recovery_approved', 'on')
          and (
            trigger.id in ['target_met', 'target_time_reached', 'daily_reset']
            or (
              trigger.id == 'reconcile'
              and (
                (is_number(soc) and is_number(target)
                  and (soc | float) >= (target | float))
                or now() >= today_at(target_time)
              )
            )
          )
        }}
      expected_back_should_clear: >-
        {{
          is_state('input_boolean.ev_expected_back_today', 'on')
          and (
            trigger.id in ['expected_return_fulfilled', 'daily_reset']
            or (
              trigger.id == 'reconcile'
              and states('sensor.ev_charging_availability')
                in ['READY', 'CHARGING']
            )
          )
        }}
  - variables:
      cleanup_happened: >-
        {{
          (recovery_should_clear | bool)
          or (expected_back_should_clear | bool)
          or trigger.id == 'daily_reset'
        }}
  - if:
      - condition: template
        value_template: "{{ recovery_should_clear | bool }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hems_ev_recovery_approved
  - if:
      - condition: template
        value_template: "{{ expected_back_should_clear | bool }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_expected_back_today
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'daily_reset' }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hems_ev_long_drive_today
  - if:
      - condition: template
        value_template: "{{ cleanup_happened | bool }}"
    then:
      - action: notify.mobile_app_primary_phone
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: hems_ev_30_50_choice
      - action: notify.mobile_app_secondary_ev_phone
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: hems_ev_30_50_choice
mode: single
max_exceeded: silent
