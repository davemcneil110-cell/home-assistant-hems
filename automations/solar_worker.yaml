alias: HEMS - Solar Worker
description: >-
  Sole SolarEdge export-limit hardware worker. It follows the dual-latched HEMS
  coordinated export limit, verifies that every curtailment command remains in
  place, and enters a quiet 30-minute backoff if another controller or the
  inverter overwrites that command. It sends one notification when an external
  control conflict begins and one when it clears. Manual override blocks every
  hardware command. A home connection confirmed by the SolarEdge charger blocks
  curtailment while an authorised EV charging target remains unmet and receives
  an immediate normal-limit restoration;
  unavailable EV SOC during that connection fails safe. BYD vehicle telemetry
  cannot establish a home connection.
  Ordinary successful corrections are intentionally silent.

triggers:
  - trigger: state
    entity_id: sensor.hems_coordinated_solar_export_limit
    id: coordinated_limit

  - trigger: state
    entity_id:
      - input_boolean.hems_solar_automatic_control_enabled
      - input_boolean.hems_solar_manual_override
      - input_boolean.hems_solar_curtailment_latched
      - input_boolean.hems_solar_recovery_latched
      - input_boolean.hems_solar_external_control_conflict
      - input_datetime.hems_solar_external_control_retry_after
    id: control_state

  - trigger: state
    entity_id:
      - input_number.maximum_solar_export
      - input_number.hems_solar_minimum_export_limit
      - input_number.hems_solar_curtailment_recovery_limit
      - input_number.hems_solar_external_control_backoff_minutes
    id: configuration

  - trigger: state
    entity_id:
      - binary_sensor.solaredge_ev_charger_ev_charger_connected
      - binary_sensor.solaredge_ev_charger_ev_excess_solar_enabled
      - sensor.solaredge_ev_charger_ev_excess_solar_status
      - sensor.hems_effective_ev_soc
      - sensor.hems_ev_target_today
      - sensor.hems_ev_curtailment_demand
      - input_select.hems_ev_connection_charge_plan
      - input_boolean.hems_ev_manual_override
    id: native_ev

  - trigger: state
    entity_id:
      - sensor.hems_effective_feed_in_price
      - sensor.hems_effective_solar_power
      - sensor.solcast_pv_forecast_forecast_remaining_today
      - sun.sun
    id: solar_conditions

  - trigger: state
    entity_id:
      - select.house_solaredge_se8250h_inverter_export_control_limit_mode
      - select.house_solaredge_se8250h_inverter_export_control_mode
    id: inverter_mode

  - trigger: state
    entity_id: number.house_solaredge_se8250h_inverter_export_control_site_limit
    for: "00:01:00"
    id: inverter_readback

  - trigger: time_pattern
    minutes: "/5"
    id: periodic

  - trigger: homeassistant
    event: start
    id: startup

conditions: []

actions:
  - condition: state
    entity_id: input_boolean.hems_solar_manual_override
    state: "off"

  - variables:
      automatic_control_enabled: >-
        {{ is_state('input_boolean.hems_solar_automatic_control_enabled', 'on') }}
      coordinated_raw: >-
        {{ states('sensor.hems_coordinated_solar_export_limit') }}
      maximum_raw: >-
        {{ states('input_number.maximum_solar_export') }}
      minimum_raw: >-
        {{ states('input_number.hems_solar_minimum_export_limit') }}
      recovery_raw: >-
        {{ states('input_number.hems_solar_curtailment_recovery_limit') }}
      actual_raw: >-
        {{ states('number.house_solaredge_se8250h_inverter_export_control_site_limit') }}
      limit_mode: >-
        {{ states('select.house_solaredge_se8250h_inverter_export_control_limit_mode') }}
      control_mode: >-
        {{ states('select.house_solaredge_se8250h_inverter_export_control_mode') }}
      decision_reason: >-
        {{ state_attr('sensor.hems_coordinated_solar_export_limit', 'decision_reason') | default('COORDINATED_HEMS_REQUEST', true) }}
      conflict_was_active: >-
        {{ is_state('input_boolean.hems_solar_external_control_conflict', 'on') }}
      retry_after_timestamp: >-
        {{ as_timestamp(states('input_datetime.hems_solar_external_control_retry_after'), 0) }}
      retry_due: >-
        {{ as_timestamp(now()) >= (retry_after_timestamp | float(0)) }}
      backoff_minutes: >-
        {{ states('input_number.hems_solar_external_control_backoff_minutes') | float(30) }}
      ev_curtailment_block: >-
        {{ states('sensor.hems_ev_curtailment_demand') != 'CLEAR' }}

  - condition: template
    value_template: >-
      {{
        is_number(maximum_raw)
        and is_number(minimum_raw)
        and is_number(recovery_raw)
        and is_number(actual_raw)
      }}

  - variables:
      maximum_export: >-
        {% set value = maximum_raw | float %}
        {{ ([[value, 1] | max, 10000] | min) | round(0) }}
      minimum_export: >-
        {% set value = minimum_raw | float %}
        {% set safe_value = [[value, 1] | max, 10000] | min %}
        {{ ([safe_value, maximum_raw | float] | min) | round(0) }}
      recovery_export: >-
        {% set value = recovery_raw | float %}
        {% set above_minimum = [value, minimum_raw | float] | max %}
        {{ ([above_minimum, maximum_raw | float] | min) | round(0) }}
      seconds_since_last_limit_change: >-
        {{
          as_timestamp(now())
          - as_timestamp(
              states.number.house_solaredge_se8250h_inverter_export_control_site_limit.last_changed,
              as_timestamp(now())
            )
        }}

  - variables:
      desired_limit: >-
        {% if not automatic_control_enabled %}
          {{ maximum_export | float }}
        {% elif ev_curtailment_block %}
          {{ maximum_export | float }}
        {% elif is_number(coordinated_raw) %}
          {% set requested = coordinated_raw | float %}
          {% set above_minimum = [requested, minimum_export | float] | max %}
          {{ ([above_minimum, maximum_export | float] | min) | round(0) }}
        {% else %}
          unavailable
        {% endif %}
      priority_transition: >-
        {{
          not automatic_control_enabled
          or ev_curtailment_block
          or (
            is_number(coordinated_raw)
            and coordinated_raw | float <= minimum_export | float + 50
          )
          or decision_reason in [
            'POWERWALL_RECOVERY_LATCH_ENTRY',
            'RECOVERY_LATCHED_UNTIL_STABLE_RELEASE',
            'FULL_CURTAILMENT_LATCHED_UNTIL_RELEASE_SOC',
            'NATIVE_EV_EXCESS_SOLAR_PRIORITY',
            'EV_AUTHORISED_CHARGING_DEMAND_CURTAILMENT_BLOCKED',
            'SOLAR_FINISHED_NORMAL_EXPORT_LIMIT',
            'ABOVE_MINIMUM_GRID_FEED_NORMAL_EXPORT',
            'SOC_CYCLE_DISCHARGE_100W_TO_PROTECTED_FLOOR',
            'SOC_CYCLE_RECOVERY_5000W_WITH_PROTECTED_FLOOR',
            'AUTOMATIC_CONTROL_DISABLED'
          ]
        }}

  - condition: template
    value_template: "{{ is_number(desired_limit) }}"

  - condition: template
    value_template: >-
      {{
        not automatic_control_enabled
        or (
          limit_mode == 'Total'
          and control_mode == 'Direct Export Limitation'
        )
      }}

  # A latched conflict permits no repeated curtailment commands until the
  # configured retry time. A normal 5000 W restoration is never delayed.
  - choose:
      - conditions: >-
          {{
            conflict_was_active
            and desired_limit | float < maximum_export | float - 50
            and not retry_due
          }}
        sequence:
          - stop: >-
              External SolarEdge control conflict is in its quiet backoff
              period. HEMS will retry once after the configured time.

  - condition: template
    value_template: >-
      {{ ((actual_raw | float) - (desired_limit | float)) | abs >= 50 }}

  # Normal increases remain protected by the existing 30-minute hold. Safety
  # exits, native EV priority, curtailment entry and conflict retries are
  # immediate decisions.
  - condition: template
    value_template: >-
      {{
        conflict_was_active
        or priority_transition
        or seconds_since_last_limit_change | float(0) >= 1800
      }}

  # During an external-control retry, move the next permitted retry forward
  # before sending the command. This prevents parallel triggers from creating
  # another command loop.
  - choose:
      - conditions: >-
          {{
            conflict_was_active
            and desired_limit | float < maximum_export | float - 50
            and retry_due
          }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hems_solar_external_control_retry_after
            data:
              datetime: >-
                {{
                  (now() + timedelta(minutes=backoff_minutes | float(30)))
                  .strftime('%Y-%m-%d %H:%M:%S')
                }}

  # A fresh curtailment request must remain valid for one minute. Conflict
  # retries do not incur an additional delay because they already waited for
  # the complete backoff interval.
  - choose:
      - conditions: >-
          {{
            not conflict_was_active
            and automatic_control_enabled
            and not ev_curtailment_block
            and desired_limit | float < maximum_export | float - 50
          }}
        sequence:
          - delay: "00:01:00"

          - condition: state
            entity_id: input_boolean.hems_solar_manual_override
            state: "off"

          - condition: state
            entity_id: input_boolean.hems_solar_automatic_control_enabled
            state: "on"

          - condition: template
            value_template: >-
              {{
                is_state(
                  'select.house_solaredge_se8250h_inverter_export_control_limit_mode',
                  'Total'
                )
                and is_state(
                  'select.house_solaredge_se8250h_inverter_export_control_mode',
                  'Direct Export Limitation'
                )
              }}

          - condition: template
            value_template: >-
              {% set current = states('sensor.hems_coordinated_solar_export_limit') %}
              {{
                is_number(current)
                and (current | float - desired_limit | float) | abs < 1
              }}

          - condition: template
            value_template: >-
              {{ states('sensor.hems_ev_curtailment_demand') == 'CLEAR' }}

  - condition: state
    entity_id: input_boolean.hems_solar_manual_override
    state: "off"

  - condition: template
    value_template: >-
      {% set current = states('number.house_solaredge_se8250h_inverter_export_control_site_limit') %}
      {{
        is_number(current)
        and (current | float - desired_limit | float) | abs >= 50
      }}

  - action: number.set_value
    target:
      entity_id: number.house_solaredge_se8250h_inverter_export_control_site_limit
    data:
      value: "{{ desired_limit | float }}"

  # First verify that SolarEdge accepted the write.
  - wait_template: >-
      {% set current = states('number.house_solaredge_se8250h_inverter_export_control_site_limit') %}
      {{
        is_number(current)
        and (current | float - desired_limit | float) | abs < 50
      }}
    timeout: "00:00:30"
    continue_on_timeout: true

  - choose:
      - conditions: "{{ not wait.completed }}"
        sequence:
          - variables:
              current_coordinated: >-
                {{ states('sensor.hems_coordinated_solar_export_limit') }}
              current_ev_curtailment_block: >-
                {{ states('sensor.hems_ev_curtailment_demand') != 'CLEAR' }}
              curtailment_still_required: >-
                {{
                  is_state('input_boolean.hems_solar_automatic_control_enabled', 'on')
                  and is_state('input_boolean.hems_solar_manual_override', 'off')
                  and not current_ev_curtailment_block
                  and is_number(current_coordinated)
                  and (current_coordinated | float - desired_limit | float) | abs < 50
                  and desired_limit | float < maximum_export | float - 50
                }}

          - choose:
              - conditions: >-
                  {{
                    current_ev_curtailment_block
                    and is_state('input_boolean.hems_solar_manual_override', 'off')
                  }}
                sequence:
                  - action: number.set_value
                    target:
                      entity_id: number.house_solaredge_se8250h_inverter_export_control_site_limit
                    data:
                      value: "{{ maximum_export | float }}"

                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hems_solar_external_control_conflict

                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hems_solar_external_control_retry_after
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

                  - stop: EV has authorised charging demand; restored the normal export limit.

              - conditions: "{{ curtailment_still_required }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hems_solar_external_control_conflict

                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hems_solar_external_control_retry_after
                    data:
                      datetime: >-
                        {{
                          (now() + timedelta(minutes=backoff_minutes | float(30)))
                          .strftime('%Y-%m-%d %H:%M:%S')
                        }}

                  - choose:
                      - conditions: "{{ not conflict_was_active }}"
                        sequence:
                          - action: notify.mobile_app_primary_phone
                            data:
                              title: HEMS Solar external control conflict
                              message: >-
                                SolarEdge did not accept the HEMS request for
                                {{ desired_limit | float | round(0) | int }} W.
                                HEMS has stopped repeated commands and will try
                                once every {{ backoff_minutes | round(0) | int }}
                                minutes while negative-price curtailment remains
                                necessary. No manual action is required.
                              data:
                                tag: hems_solar_external_conflict
                                group: hems_solar
                                alert_once: true

          - stop: SolarEdge did not acknowledge the requested export limit.

  # A curtailment write must also survive a settling period. This catches the
  # observed pattern where another actor restores 5000 W shortly after HEMS
  # successfully writes 100 W or 2500 W.
  - choose:
      - conditions: >-
          {{ desired_limit | float < maximum_export | float - 50 }}
        sequence:
          - delay: "00:01:30"

          - variables:
              retained_actual: >-
                {{ states('number.house_solaredge_se8250h_inverter_export_control_site_limit') }}
              current_coordinated: >-
                {{ states('sensor.hems_coordinated_solar_export_limit') }}
              current_ev_curtailment_block: >-
                {{ states('sensor.hems_ev_curtailment_demand') != 'CLEAR' }}
              curtailment_still_required: >-
                {{
                  is_state('input_boolean.hems_solar_automatic_control_enabled', 'on')
                  and is_state('input_boolean.hems_solar_manual_override', 'off')
                  and not current_ev_curtailment_block
                  and is_number(current_coordinated)
                  and (current_coordinated | float - desired_limit | float) | abs < 50
                  and desired_limit | float < maximum_export | float - 50
                }}
              command_retained: >-
                {{
                  is_number(retained_actual)
                  and (retained_actual | float - desired_limit | float) | abs < 50
                }}

          - choose:
              - conditions: >-
                  {{
                    current_ev_curtailment_block
                    and is_state('input_boolean.hems_solar_manual_override', 'off')
                  }}
                sequence:
                  - action: number.set_value
                    target:
                      entity_id: number.house_solaredge_se8250h_inverter_export_control_site_limit
                    data:
                      value: "{{ maximum_export | float }}"

                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hems_solar_external_control_conflict

                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hems_solar_external_control_retry_after
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

                  - stop: EV has authorised charging demand; restored the normal export limit.

              - conditions: >-
                  {{ curtailment_still_required and not command_retained }}
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hems_solar_external_control_conflict

                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hems_solar_external_control_retry_after
                    data:
                      datetime: >-
                        {{
                          (now() + timedelta(minutes=backoff_minutes | float(30)))
                          .strftime('%Y-%m-%d %H:%M:%S')
                        }}

                  - choose:
                      - conditions: "{{ not conflict_was_active }}"
                        sequence:
                          - action: notify.mobile_app_primary_phone
                            data:
                              title: HEMS Solar external control conflict
                              message: >-
                                HEMS set the SolarEdge export limit to
                                {{ desired_limit | float | round(0) | int }} W,
                                but another controller or the inverter restored
                                it to {{ retained_actual | float(0) | round(0) | int }} W.
                                Repeated commands are paused. HEMS will retry once
                                every {{ backoff_minutes | round(0) | int }} minutes
                                while curtailment remains necessary.
                              data:
                                tag: hems_solar_external_conflict
                                group: hems_solar
                                alert_once: true

                  - stop: External control overwrote the SolarEdge limit.

              - conditions: >-
                  {{ command_retained and conflict_was_active }}
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hems_solar_external_control_conflict

                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hems_solar_external_control_retry_after
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

                  - action: notify.mobile_app_primary_phone
                    data:
                      title: HEMS Solar control conflict cleared
                      message: >-
                        SolarEdge retained the HEMS export limit of
                        {{ desired_limit | float | round(0) | int }} W through
                        the readback period. Normal Solar Worker control has
                        resumed.
                      data:
                        tag: hems_solar_external_conflict
                        group: hems_solar
                        alert_once: true

mode: single
max_exceeded: silent
