alias: HEMS - EV Above-30 Charge Choice
description: >-
  For an EV connected above 30% and below today's target, records one durable
  plan for the complete physical connection: Cheap Grid, Solar Only, or Charge
  Now. Cheap Grid and Charge Now are followed by a second choice between the
  normal daily target and 100% full. Solar Only is a one-step, targetless plan:
  it uses whatever genuine/native excess solar becomes available and may
  continue opportunistically up to the vehicle's physical full state.
  The choice survives Home Assistant and automation reloads and is reset only
  after both plug sensors confirm a genuine unplug. One reminder is sent after
  15 minutes if unanswered. This automation only updates HEMS planning helpers
  and sends EV notifications to the primary and secondary EV users; the guarded EV Worker remains
  the sole full-rate charger controller.
triggers:
  - trigger: state
    entity_id: binary_sensor.solaredge_ev_charger_ev_charger_connected
    to: "on"
    for: "00:00:20"
    id: solaredge_connected
  - trigger: state
    entity_id: binary_sensor.atto_3_plug
    to: "on"
    for: "00:00:20"
    id: byd_plugged
  - trigger: time_pattern
    minutes: "/1"
    id: connected_recovery_scan
conditions:
  - condition: state
    entity_id: input_boolean.enable_ev_automation
    state: "on"
  - condition: state
    entity_id: input_boolean.hems_ev_manual_override
    state: "off"
  - condition: state
    entity_id: input_boolean.hems_test_mode
    state: "off"
  - condition: state
    entity_id: input_boolean.hems_test_ev_away
    state: "off"
  - condition: state
    entity_id: input_boolean.hems_test_ev_home_plugged_low_soc
    state: "off"
  - condition: state
    entity_id: input_select.hems_ev_connection_charge_plan
    state: Unanswered
  - condition: template
    value_template: >-
      {{
        is_state(
          'binary_sensor.solaredge_ev_charger_ev_charger_connected',
          'on'
        )
        or is_state('binary_sensor.atto_3_plug', 'on')
      }}
actions:
  - delay: "00:00:02"

  - condition: template
    value_template: >-
      {% set soc = states('sensor.hems_effective_ev_soc') %}
      {% set target = states('sensor.hems_ev_target_today') %}
      {{
        is_number(soc)
        and is_number(target)
        and (soc | float) > 30
        and (soc | float) < (target | float)
        and is_state('input_boolean.hems_ev_recovery_approved', 'off')
        and is_state(
          'input_select.hems_ev_connection_charge_plan',
          'Unanswered'
        )
      }}

  - variables:
      ev_soc: >-
        {{ states('sensor.hems_effective_ev_soc') | float | round(0) | int }}
      ev_target: >-
        {{ states('sensor.hems_ev_target_today') | float | round(0) | int }}
      normal_ev_target: >-
        {{ states('input_number.ev_target') | float | round(0) | int }}
      current_price_display: >-
        {% set value = states('sensor.hems_effective_import_price') %}
        {% if is_number(value) %}
          ${{ value | float | round(3) }}/kWh
        {% else %}
          unavailable
        {% endif %}
      cheapest_price_display: >-
        {% set value = states('sensor.hems_cheapest_visible_import_price') %}
        {% if is_number(value) %}
          ${{ value | float | round(3) }}/kWh
        {% else %}
          unavailable
        {% endif %}

  - action: notify.mobile_app_primary_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_connection_charge_plan
  - action: notify.mobile_app_secondary_ev_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_connection_charge_plan

  - action: notify.mobile_app_primary_phone
    continue_on_error: true
    data:
      title: HEMS EV charging choice
      message: >-
        The EV is connected at {{ ev_soc }}%, below today's {{ ev_target }}%
        target. Current Amber price: {{ current_price_display }}. Cheapest
        visible price: {{ cheapest_price_display }}. Choose the plan for this
        connection.
      data:
        tag: hems_ev_connection_charge_plan
        actions:
          - action: HEMS_EV_CHEAP_GRID_PLAN
            title: Cheap Grid
          - action: HEMS_EV_SOLAR_ONLY_PLAN
            title: Solar Only
          - action: HEMS_EV_CHARGE_NOW
            title: Charge Now
  - action: notify.mobile_app_secondary_ev_phone
    continue_on_error: true
    data:
      title: HEMS EV charging choice
      message: >-
        The EV is connected at {{ ev_soc }}%, below today's {{ ev_target }}%
        target. Current Amber price: {{ current_price_display }}. Cheapest
        visible price: {{ cheapest_price_display }}. Choose the plan for this
        connection.
      data:
        tag: hems_ev_connection_charge_plan
        actions:
          - action: HEMS_EV_CHEAP_GRID_PLAN
            title: Cheap Grid
          - action: HEMS_EV_SOLAR_ONLY_PLAN
            title: Solar Only
          - action: HEMS_EV_CHARGE_NOW
            title: Charge Now

  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: HEMS_EV_CHEAP_GRID_PLAN
        id: cheap_grid
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: HEMS_EV_SOLAR_ONLY_PLAN
        id: solar_only
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: HEMS_EV_CHARGE_NOW
        id: charge_now
      - trigger: template
        value_template: >-
          {{
            is_state('binary_sensor.atto_3_plug', 'off')
            and is_state(
              'binary_sensor.solaredge_ev_charger_ev_charger_connected',
              'off'
            )
          }}
        id: unplugged
    timeout: "00:15:00"
    continue_on_timeout: true

  - variables:
      initial_plan_choice: >-
        {{ wait.trigger.id if wait.trigger is not none else 'timed_out' }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ initial_plan_choice == 'timed_out' }}"
        sequence:
          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: HEMS EV charging choice
              message: >-
                Reminder: the connected EV is at {{ ev_soc }}%, below today's
                {{ ev_target }}% target. Choose Cheap Grid, Solar Only, or
                Charge Now for this connection.
              data:
                tag: hems_ev_connection_charge_plan
                actions:
                  - action: HEMS_EV_CHEAP_GRID_PLAN
                    title: Cheap Grid
                  - action: HEMS_EV_SOLAR_ONLY_PLAN
                    title: Solar Only
                  - action: HEMS_EV_CHARGE_NOW
                    title: Charge Now
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: HEMS EV charging choice
              message: >-
                Reminder: the connected EV is at {{ ev_soc }}%, below today's
                {{ ev_target }}% target. Choose Cheap Grid, Solar Only, or
                Charge Now for this connection.
              data:
                tag: hems_ev_connection_charge_plan
                actions:
                  - action: HEMS_EV_CHEAP_GRID_PLAN
                    title: Cheap Grid
                  - action: HEMS_EV_SOLAR_ONLY_PLAN
                    title: Solar Only
                  - action: HEMS_EV_CHARGE_NOW
                    title: Charge Now
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_CHEAP_GRID_PLAN
                id: cheap_grid
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_SOLAR_ONLY_PLAN
                id: solar_only
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_CHARGE_NOW
                id: charge_now
              - trigger: template
                value_template: >-
                  {{
                    is_state('binary_sensor.atto_3_plug', 'off')
                    and is_state(
                      'binary_sensor.solaredge_ev_charger_ev_charger_connected',
                      'off'
                    )
                  }}
                id: unplugged
  - variables:
      plan_choice: >-
        {{ wait.trigger.id if wait.trigger is not none else 'unplugged' }}

  - action: notify.mobile_app_primary_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_connection_charge_plan
  - action: notify.mobile_app_secondary_ev_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_connection_charge_plan

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ plan_choice == 'solar_only' }}"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.hems_ev_connection_charge_plan
            data:
              option: Solar Only
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hems_ev_recovery_approved
                - input_boolean.ev_expected_back_today
          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: HEMS EV plan saved
              message: >-
                Solar Only selected. Grid charging is blocked for this
                connection. No SOC target applies to this plan; genuine/native
                excess solar may charge the EV whenever surplus is available,
                up to the vehicle's physical full state.
              data:
                tag: hems_ev_connection_charge_plan_result
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: HEMS EV plan saved
              message: >-
                Solar Only selected. Grid charging is blocked for this
                connection. No SOC target applies to this plan; genuine/native
                excess solar may charge the EV whenever surplus is available,
                up to the vehicle's physical full state.
              data:
                tag: hems_ev_connection_charge_plan_result

      - conditions:
          - condition: template
            value_template: "{{ plan_choice in ['cheap_grid', 'charge_now'] }}"
        sequence:
          - variables:
              selected_plan_label: >-
                {{ 'Cheap Grid' if plan_choice == 'cheap_grid' else 'Charge Now' }}
          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: HEMS EV charge target
              message: >-
                {{ selected_plan_label }} selected. Should HEMS charge the EV
                to the normal {{ normal_ev_target }}% target or charge it to
                100%?
              data:
                tag: hems_ev_connection_charge_plan
                actions:
                  - action: HEMS_EV_CHARGE_TO_TARGET
                    title: Charge to Target
                  - action: HEMS_EV_CHARGE_TO_FULL
                    title: Charge to Full
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: HEMS EV charge target
              message: >-
                {{ selected_plan_label }} selected. Should HEMS charge the EV
                to the normal {{ normal_ev_target }}% target or charge it to
                100%?
              data:
                tag: hems_ev_connection_charge_plan
                actions:
                  - action: HEMS_EV_CHARGE_TO_TARGET
                    title: Charge to Target
                  - action: HEMS_EV_CHARGE_TO_FULL
                    title: Charge to Full

          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_CHARGE_TO_TARGET
                id: charge_to_target
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_CHARGE_TO_FULL
                id: charge_to_full
              - trigger: template
                value_template: >-
                  {{
                    is_state('binary_sensor.atto_3_plug', 'off')
                    and is_state(
                      'binary_sensor.solaredge_ev_charger_ev_charger_connected',
                      'off'
                    )
                  }}
                id: unplugged
            timeout: "00:15:00"
            continue_on_timeout: true

          - variables:
              initial_target_choice: >-
                {{ wait.trigger.id if wait.trigger is not none else 'timed_out' }}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ initial_target_choice == 'timed_out' }}"
                sequence:
                  - action: notify.mobile_app_primary_phone
                    continue_on_error: true
                    data:
                      title: HEMS EV charge target
                      message: >-
                        Reminder: choose Charge to Target or Charge to Full to
                        complete the {{ selected_plan_label }} plan.
                      data:
                        tag: hems_ev_connection_charge_plan
                        actions:
                          - action: HEMS_EV_CHARGE_TO_TARGET
                            title: Charge to Target
                          - action: HEMS_EV_CHARGE_TO_FULL
                            title: Charge to Full
                  - action: notify.mobile_app_secondary_ev_phone
                    continue_on_error: true
                    data:
                      title: HEMS EV charge target
                      message: >-
                        Reminder: choose Charge to Target or Charge to Full to
                        complete the {{ selected_plan_label }} plan.
                      data:
                        tag: hems_ev_connection_charge_plan
                        actions:
                          - action: HEMS_EV_CHARGE_TO_TARGET
                            title: Charge to Target
                          - action: HEMS_EV_CHARGE_TO_FULL
                            title: Charge to Full
                  - wait_for_trigger:
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: HEMS_EV_CHARGE_TO_TARGET
                        id: charge_to_target
                      - trigger: event
                        event_type: mobile_app_notification_action
                        event_data:
                          action: HEMS_EV_CHARGE_TO_FULL
                        id: charge_to_full
                      - trigger: template
                        value_template: >-
                          {{
                            is_state('binary_sensor.atto_3_plug', 'off')
                            and is_state(
                              'binary_sensor.solaredge_ev_charger_ev_charger_connected',
                              'off'
                            )
                          }}
                        id: unplugged
          - variables:
              target_choice: >-
                {{ wait.trigger.id if wait.trigger is not none else 'unplugged' }}

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_connection_charge_plan
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_connection_charge_plan

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ target_choice == 'charge_to_target' }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.hems_ev_long_drive_today
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.hems_ev_connection_charge_plan
                    data:
                      option: >-
                        {{ 'Cheap Grid' if plan_choice == 'cheap_grid' else 'Charge Now' }}

              - conditions:
                  - condition: template
                    value_template: "{{ target_choice == 'charge_to_full' }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hems_ev_long_drive_today
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.hems_ev_connection_charge_plan
                    data:
                      option: >-
                        {{ 'Cheap Grid' if plan_choice == 'cheap_grid' else 'Charge Now' }}

          - if:
              - condition: template
                value_template: >-
                  {{
                    target_choice in ['charge_to_target', 'charge_to_full']
                    and plan_choice == 'cheap_grid'
                  }}
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.hems_ev_recovery_approved
                    - input_boolean.ev_expected_back_today

          - if:
              - condition: template
                value_template: >-
                  {{
                    target_choice in ['charge_to_target', 'charge_to_full']
                    and plan_choice == 'charge_now'
                  }}
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    - input_boolean.hems_ev_recovery_approved
                    - input_boolean.ev_expected_back_today

          - if:
              - condition: template
                value_template: >-
                  {{ target_choice in ['charge_to_target', 'charge_to_full'] }}
            then:
              - action: notify.mobile_app_primary_phone
                continue_on_error: true
                data:
                  title: HEMS EV plan saved
                  message: >-
                    {{ selected_plan_label }} was approved to
                    {{ '100% full' if target_choice == 'charge_to_full' else
                    (normal_ev_target ~ '%') }}. The guarded EV Worker remains
                    the sole full-rate charger controller.
                  data:
                    tag: hems_ev_connection_charge_plan_result
              - action: notify.mobile_app_secondary_ev_phone
                continue_on_error: true
                data:
                  title: HEMS EV plan saved
                  message: >-
                    {{ selected_plan_label }} was approved to
                    {{ '100% full' if target_choice == 'charge_to_full' else
                    (normal_ev_target ~ '%') }}. The guarded EV Worker remains
                    the sole full-rate charger controller.
                  data:
                    tag: hems_ev_connection_charge_plan_result

mode: single
max_exceeded: silent
