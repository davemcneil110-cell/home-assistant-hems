alias: HEMS - EV 30-50 Charge Choice
description: >-
  When either the BYD or SolarEdge integration confirms that the EV is plugged
  in while its SOC is above 30% and at or below 50%, asks primary user and secondary EV user
  whether to keep normal solar/cheap-grid planning or charge immediately. A
  Charge now response opens a second choice: until unplugged, until today's
  target, or until full. The first phone response wins at each stage. The
  automation remains active until both plug sensors report unplugged, preventing
  the integrations' delayed updates from producing a duplicate prompt. This
  automation only updates HEMS planning helpers and sends notifications; the
  guarded EV Worker remains the sole charger owner.
triggers:
  - trigger: state
    entity_id: binary_sensor.solaredge_ev_charger_ev_charger_connected
    to: "on"
    for: "00:00:20"
    id: solaredge_connected
  - trigger: state
    entity_id: binary_sensor.atto_3_plug
    to: "on"
    for: "00:00:20"
    id: byd_plugged
conditions:
  - condition: state
    entity_id: input_boolean.enable_ev_automation
    state: "on"
  - condition: state
    entity_id: input_boolean.hems_ev_manual_override
    state: "off"
  - condition: state
    entity_id: input_boolean.hems_test_mode
    state: "off"
  - condition: state
    entity_id: input_boolean.hems_test_ev_away
    state: "off"
  - condition: state
    entity_id: input_boolean.hems_test_ev_home_plugged_low_soc
    state: "off"
  - condition: template
    value_template: >-
      {{
        is_state(
          'binary_sensor.solaredge_ev_charger_ev_charger_connected',
          'on'
        )
        or is_state('binary_sensor.atto_3_plug', 'on')
      }}
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.hems_ev_recovery_approved
            state: "on"
          - condition: state
            entity_id: input_boolean.ev_expected_back_today
            state: "off"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.hems_ev_recovery_approved

  - delay: "00:00:02"

  - condition: template
    value_template: >-
      {% set soc = states('sensor.hems_effective_ev_soc') %}
      {% set target = states('sensor.hems_ev_target_today') %}
      {{
        is_number(soc)
        and is_number(target)
        and (soc | float) > 30
        and (soc | float) <= 50
        and (soc | float) < (target | float)
        and is_state('input_boolean.hems_ev_recovery_approved', 'off')
      }}

  - variables:
      ev_soc: >-
        {{ states('sensor.hems_effective_ev_soc') | float | round(0) | int }}
      ev_target: >-
        {{ states('sensor.hems_ev_target_today') | float | round(0) | int }}
      current_price_display: >-
        {% set value = states('sensor.hems_effective_import_price') %}
        {% if is_number(value) %}
          ${{ value | float | round(3) }}/kWh
        {% else %}
          unavailable
        {% endif %}
      cheapest_price_display: >-
        {% set value = states('sensor.hems_cheapest_visible_import_price') %}
        {% if is_number(value) %}
          ${{ value | float | round(3) }}/kWh
        {% else %}
          unavailable
        {% endif %}

  - action: notify.mobile_app_primary_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_30_50_choice
  - action: notify.mobile_app_secondary_ev_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_30_50_choice

  - action: notify.mobile_app_primary_phone
    continue_on_error: true
    data:
      title: HEMS EV charging choice
      message: >-
        The EV has been plugged in at {{ ev_soc }}%, below today's
        {{ ev_target }}% target. Current Amber price:
        {{ current_price_display }}. Cheapest visible price:
        {{ cheapest_price_display }}. Keep normal excess-solar/cheap-grid
        planning, or charge now?
      data:
        tag: hems_ev_30_50_choice
        alert_once: true
        ttl: 0
        priority: high
        channel: HEMS EV Decisions
        importance: high
        actions:
          - action: HEMS_EV_WAIT_FOR_CHEAP_GRID
            title: Wait for cheap grid
            authenticationRequired: true
          - action: HEMS_EV_CHARGE_NOW
            title: Charge now
            authenticationRequired: true
          - action: HEMS_EV_DECIDE_LATER
            title: Decide later
            authenticationRequired: true
  - action: notify.mobile_app_secondary_ev_phone
    continue_on_error: true
    data:
      title: HEMS EV charging choice
      message: >-
        The EV has been plugged in at {{ ev_soc }}%, below today's
        {{ ev_target }}% target. Current Amber price:
        {{ current_price_display }}. Cheapest visible price:
        {{ cheapest_price_display }}. Keep normal excess-solar/cheap-grid
        planning, or charge now?
      data:
        tag: hems_ev_30_50_choice
        alert_once: true
        ttl: 0
        priority: high
        channel: HEMS EV Decisions
        importance: high
        actions:
          - action: HEMS_EV_WAIT_FOR_CHEAP_GRID
            title: Wait for cheap grid
            authenticationRequired: true
          - action: HEMS_EV_CHARGE_NOW
            title: Charge now
            authenticationRequired: true
          - action: HEMS_EV_DECIDE_LATER
            title: Decide later
            authenticationRequired: true

  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: HEMS_EV_WAIT_FOR_CHEAP_GRID
        id: wait_for_cheap_grid
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: HEMS_EV_CHARGE_NOW
        id: charge_now
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: HEMS_EV_DECIDE_LATER
        id: decide_later
    timeout: "01:00:00"
    continue_on_timeout: true

  - variables:
      first_choice: >-
        {{ wait.trigger.id if wait.trigger is not none else 'timed_out' }}

  - action: notify.mobile_app_primary_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_30_50_choice
  - action: notify.mobile_app_secondary_ev_phone
    continue_on_error: true
    data:
      message: clear_notification
      data:
        tag: hems_ev_30_50_choice

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ first_choice == 'wait_for_cheap_grid' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hems_ev_recovery_approved
                - input_boolean.ev_expected_back_today
          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: HEMS EV plan updated
              message: >-
                Normal planning remains active. The EV will wait for genuine
                excess solar or the planned cheap-grid interval.
              data:
                tag: hems_ev_30_50_result
                alert_once: true
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: HEMS EV plan updated
              message: >-
                Normal planning remains active. The EV will wait for genuine
                excess solar or the planned cheap-grid interval.
              data:
                tag: hems_ev_30_50_result
                alert_once: true

      - conditions:
          - condition: template
            value_template: "{{ first_choice == 'charge_now' }}"
        sequence:
          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: HEMS EV charge-now limit
              message: >-
                How persistent should this immediate charging instruction be?
              data:
                tag: hems_ev_30_50_choice
                alert_once: true
                ttl: 0
                priority: high
                channel: HEMS EV Decisions
                importance: high
                actions:
                  - action: HEMS_EV_UNTIL_UNPLUGGED
                    title: Until unplugged
                    authenticationRequired: true
                  - action: HEMS_EV_UNTIL_TARGET
                    title: Until target
                    authenticationRequired: true
                  - action: HEMS_EV_UNTIL_FULL
                    title: Until full
                    authenticationRequired: true
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: HEMS EV charge-now limit
              message: >-
                How persistent should this immediate charging instruction be?
              data:
                tag: hems_ev_30_50_choice
                alert_once: true
                ttl: 0
                priority: high
                channel: HEMS EV Decisions
                importance: high
                actions:
                  - action: HEMS_EV_UNTIL_UNPLUGGED
                    title: Until unplugged
                    authenticationRequired: true
                  - action: HEMS_EV_UNTIL_TARGET
                    title: Until target
                    authenticationRequired: true
                  - action: HEMS_EV_UNTIL_FULL
                    title: Until full
                    authenticationRequired: true

          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_UNTIL_UNPLUGGED
                id: until_unplugged
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_UNTIL_TARGET
                id: until_target
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_UNTIL_FULL
                id: until_full
            timeout: "01:00:00"
            continue_on_timeout: true

          - variables:
              charge_limit: >-
                {{ wait.trigger.id if wait.trigger is not none else 'timed_out' }}

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_30_50_choice
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_30_50_choice

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ charge_limit == 'until_unplugged' }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_expected_back_today
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.hems_ev_recovery_approved

              - conditions:
                  - condition: template
                    value_template: "{{ charge_limit == 'until_target' }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id:
                        - input_boolean.hems_ev_recovery_approved
                        - input_boolean.ev_expected_back_today

              - conditions:
                  - condition: template
                    value_template: "{{ charge_limit == 'until_full' }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id:
                        - input_boolean.hems_ev_long_drive_today
                        - input_boolean.hems_ev_recovery_approved
                        - input_boolean.ev_expected_back_today

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ charge_limit in [
                        'until_unplugged',
                        'until_target',
                        'until_full'
                      ] }}
                sequence:
                  - action: notify.mobile_app_primary_phone
                    continue_on_error: true
                    data:
                      title: HEMS EV charge-now approved
                      message: >-
                        Immediate charging was approved {{
                          charge_limit | replace('_', ' ')
                        }}. HEMS will apply the time-sensitive Powerwall policy
                        and the guarded EV Worker will remain the sole charger
                        controller.
                      data:
                        tag: hems_ev_30_50_result
                        alert_once: true
                  - action: notify.mobile_app_secondary_ev_phone
                    continue_on_error: true
                    data:
                      title: HEMS EV charge-now approved
                      message: >-
                        Immediate charging was approved {{
                          charge_limit | replace('_', ' ')
                        }}. HEMS will apply the time-sensitive Powerwall policy
                        and the guarded EV Worker will remain the sole charger
                        controller.
                      data:
                        tag: hems_ev_30_50_result
                        alert_once: true
            default:
              - action: notify.mobile_app_primary_phone
                continue_on_error: true
                data:
                  title: HEMS EV choice timed out
                  message: >-
                    No charge-now limit was selected. HEMS made no approval
                    change and normal planning remains in control.
                  data:
                    tag: hems_ev_30_50_result
                    alert_once: true
              - action: notify.mobile_app_secondary_ev_phone
                continue_on_error: true
                data:
                  title: HEMS EV choice timed out
                  message: >-
                    No charge-now limit was selected. HEMS made no approval
                    change and normal planning remains in control.
                  data:
                    tag: hems_ev_30_50_result
                    alert_once: true

      - conditions:
          - condition: template
            value_template: "{{ first_choice == 'decide_later' }}"
        sequence:
          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: HEMS EV decision deferred
              message: >-
                No immediate charging approval was recorded. Normal planning
                remains active for this connection.
              data:
                tag: hems_ev_30_50_result
                alert_once: true
          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: HEMS EV decision deferred
              message: >-
                No immediate charging approval was recorded. Normal planning
                remains active for this connection.
              data:
                  tag: hems_ev_30_50_result
                  alert_once: true

  - wait_template: >-
      {{
        is_state('binary_sensor.atto_3_plug', 'off')
        and is_state(
          'binary_sensor.solaredge_ev_charger_ev_charger_connected',
          'off'
        )
      }}
    timeout: "18:00:00"
    continue_on_timeout: true
mode: single
max_exceeded: silent
