alias: HEMS - EV Departure and Return Planner
description: >-
  Asks the primary and secondary EV users whether an EV that leaves below today's target will
  return for more charging. The first phone response updates the shared HEMS
  return-plan helpers. A confirmed departure first closes the previous EV
  connection, clears its Worker ownership, command fault, approvals and charge
  plan, and then asks for a completely fresh return plan. Arrival or the daily
  reset clears the return answer. It never sends charger or Powerwall commands.

triggers:
  - trigger: template
    value_template: >-
      {{
        is_state('sensor.ev_charging_availability', 'AWAY')
        and is_state('input_boolean.hems_test_ev_away', 'off')
        and is_state(
          'input_boolean.hems_test_ev_home_plugged_low_soc',
          'off'
        )
      }}
    for: "00:02:00"
    id: departed

  - trigger: state
    entity_id: input_boolean.hems_test_ev_away
    to: "on"
    for: "00:00:05"
    id: test_departed

  - trigger: state
    entity_id: sensor.ev_charging_availability
    to: READY
    for: "00:00:30"
    id: returned_ready

  - trigger: state
    entity_id: sensor.ev_charging_availability
    to: CHARGING
    for: "00:00:30"
    id: returned_charging

  - trigger: time
    at: "00:05:00"
    id: daily_reset

conditions: []

actions:
  # Treat every confirmed departure as the end of the previous connection.
  # This runs before the return question below, so a same-day return receives
  # new return and charging instructions rather than inheriting stale state.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['departed', 'test_departed'] }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.hems_ev_worker_session_active
                - input_boolean.hems_ev_urgent_charge_active
                - input_boolean.hems_ev_recovery_approved
                - input_boolean.ev_expected_back_today
                - input_boolean.hems_ev_long_drive_today

          - action: input_select.select_option
            target:
              entity_id: input_select.hems_ev_worker_session_type
            data:
              option: none

          - action: input_select.select_option
            target:
              entity_id: input_select.hems_ev_worker_command_state
            data:
              option: idle

          - action: input_select.select_option
            target:
              entity_id: input_select.hems_ev_connection_charge_plan
            data:
              option: Unanswered

          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.hems_ev_expected_return_time
            data:
              datetime: "{{ today_at('00:00:00') }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['returned_ready', 'returned_charging'] }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_expected_back_today

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'daily_reset' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_expected_back_today

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['departed', 'test_departed'] }}

          - condition: template
            value_template: >-
              {{
                trigger.id == 'test_departed'
                or (
                  is_state('input_boolean.hems_test_ev_away', 'off')
                  and is_state(
                    'input_boolean.hems_test_ev_home_plugged_low_soc',
                    'off'
                  )
                )
              }}

          - condition: state
            entity_id: input_boolean.ev_expected_back_today
            state: "off"

          - condition: template
            value_template: >-
              {% set soc = states('sensor.hems_effective_ev_soc') %}
              {% set target = states('sensor.hems_ev_target_today') %}
              {{
                is_number(soc)
                and is_number(target)
                and (soc | float) < (target | float)
              }}

          - condition: template
            value_template: >-
              {% set configured = states(
                'input_datetime.hems_charging_target_time'
              ) %}
              {% set target_time = configured
                  if configured not in [
                    'unknown', 'unavailable', 'none', ''
                  ]
                  else '14:30:00' %}
              {{
                trigger.id == 'test_departed'
                or now() < today_at(target_time)
              }}

        sequence:
          - variables:
              ev_soc: "{{ states('sensor.hems_effective_ev_soc') }}"
              ev_target: "{{ states('sensor.hems_ev_target_today') }}"
              ev_required: >-
                {% set soc = states(
                  'sensor.hems_effective_ev_soc'
                ) | float(0) %}
                {% set target = states(
                  'sensor.hems_ev_target_today'
                ) | float(0) %}
                {{ ([((target - soc) / 100) * 60.4, 0] | max)
                    | round(1) }}
              target_time: >-
                {% set configured = states(
                  'input_datetime.hems_charging_target_time'
                ) %}
                {{ configured
                    if configured not in [
                      'unknown', 'unavailable', 'none', ''
                    ]
                    else '14:30:00' }}

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              title: "HEMS EV return plan required"
              message: >-
                The EV has left at {{ ev_soc }}%, below today's {{ ev_target }}%
                target with approximately {{ ev_required }} kWh remaining.
                Will it return for more charging before the {{ target_time }}
                deadline? If returning, enter a time such as 13:30 or 1:30 PM.
              data:
                tag: hems_ev_return_question
                actions:
                  - action: REPLY
                    title: "Returning - enter time"
                  - action: HEMS_EV_NOT_RETURNING
                    title: "Not returning today"
                  - action: HEMS_EV_DECIDE_LATER
                    title: "Decide later"

          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              title: "HEMS EV return plan required"
              message: >-
                The EV has left at {{ ev_soc }}%, below today's {{ ev_target }}%
                target with approximately {{ ev_required }} kWh remaining.
                Will it return for more charging before the {{ target_time }}
                deadline? If returning, enter a time such as 13:30 or 1:30 PM.
              data:
                tag: hems_ev_return_question
                actions:
                  - action: REPLY
                    title: "Returning - enter time"
                  - action: HEMS_EV_NOT_RETURNING
                    title: "Not returning today"
                  - action: HEMS_EV_DECIDE_LATER
                    title: "Decide later"

          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: REPLY
                id: returning

              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_NOT_RETURNING
                id: not_returning

              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: HEMS_EV_DECIDE_LATER
                id: decide_later
            timeout: "08:00:00"
            continue_on_timeout: true

          - variables:
              selected_response: >-
                {% if wait.trigger is not none %}
                  {{ wait.trigger.id }}
                {% else %}
                  timed_out
                {% endif %}
              reply_text: >-
                {% if wait.trigger is not none
                      and wait.trigger.event is defined %}
                  {{ wait.trigger.event.data.reply_text
                      | default('', true) | trim }}
                {% else %}
                  {{ '' }}
                {% endif %}
              parsed_return_time: >-
                {% set value = reply_text | trim | upper
                  | replace(' ', '') | replace('.', ':') %}
                {% set ns = namespace(parsed=none) %}
                {% set has_meridiem = value.endswith('AM')
                  or value.endswith('PM') %}
                {% set body = value[:-2] if has_meridiem else value %}
                {% if has_meridiem %}
                  {% set format = '%I:%M%p' if ':' in body
                    else '%I%p' if body | length <= 2
                    else '%I%M%p' %}
                {% else %}
                  {% set format = '%H:%M' if ':' in body
                    else '%H' if body | length <= 2
                    else '%H%M' %}
                {% endif %}
                {% set ns.parsed = strptime(value, format, none) %}
                {{ ns.parsed.strftime('%H:%M:%S')
                    if ns.parsed is not none else '' }}

          - action: notify.mobile_app_primary_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

          - action: notify.mobile_app_secondary_ev_phone
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: hems_ev_return_question

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{
                        selected_response | trim == 'returning'
                        and parsed_return_time | trim != ''
                      }}
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.hems_ev_expected_return_time
                    data:
                      date: "{{ now().strftime('%Y-%m-%d') }}"
                      time: "{{ parsed_return_time | trim }}"

                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.ev_expected_back_today

                  - action: notify.mobile_app_primary_phone
                    continue_on_error: true
                    data:
                      title: "HEMS EV return plan updated"
                      message: >-
                        The EV is expected back today at
                        {{ (parsed_return_time | trim)[0:5] }}. Its remaining
                        shortfall stays in today's energy plan.
                      data:
                        tag: hems_ev_return_plan_result
                        alert_once: true

                  - action: notify.mobile_app_secondary_ev_phone
                    continue_on_error: true
                    data:
                      title: "HEMS EV return plan updated"
                      message: >-
                        The EV is expected back today at
                        {{ (parsed_return_time | trim)[0:5] }}. Its remaining
                        shortfall stays in today's energy plan.
                      data:
                        tag: hems_ev_return_plan_result
                        alert_once: true

              - conditions:
                  - condition: template
                    value_template: >-
                      {{
                        selected_response | trim == 'returning'
                        and parsed_return_time | trim == ''
                      }}
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_expected_back_today

                  - action: notify.mobile_app_primary_phone
                    continue_on_error: true
                    data:
                      title: "HEMS could not read the return time"
                      message: >-
                        The reply "{{ reply_text }}" was not recognised. The EV
                        remains excluded from today's plan. Enter the helper
                        manually and then enable EV Expected Back Today.
                      data:
                        tag: hems_ev_return_plan_result
                        alert_once: true
                        actions:
                          - action: URI
                            title: "Open return time"
                            uri: >-
                              entityId:input_datetime.hems_ev_expected_return_time

                  - action: notify.mobile_app_secondary_ev_phone
                    continue_on_error: true
                    data:
                      title: "HEMS could not read the return time"
                      message: >-
                        The reply "{{ reply_text }}" was not recognised. The EV
                        remains excluded from today's plan. Enter the helper
                        manually and then enable EV Expected Back Today.
                      data:
                        tag: hems_ev_return_plan_result
                        alert_once: true
                        actions:
                          - action: URI
                            title: "Open return time"
                            uri: >-
                              entityId:input_datetime.hems_ev_expected_return_time

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ selected_response | trim == 'not_returning' }}
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_expected_back_today

                  - action: notify.mobile_app_primary_phone
                    continue_on_error: true
                    data:
                      title: "HEMS EV plan updated"
                      message: >-
                        The EV is not expected back today and has been excluded
                        from today's remaining charging requirement.
                      data:
                        tag: hems_ev_return_plan_result
                        alert_once: true

                  - action: notify.mobile_app_secondary_ev_phone
                    continue_on_error: true
                    data:
                      title: "HEMS EV plan updated"
                      message: >-
                        The EV is not expected back today and has been excluded
                        from today's remaining charging requirement.
                      data:
                        tag: hems_ev_return_plan_result
                        alert_once: true

            default:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ev_expected_back_today

mode: restart
max_exceeded: silent
